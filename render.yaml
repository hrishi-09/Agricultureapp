services:
  - type: web
    name: agrixai
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: agrixai-db, property: connectionString}
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TZ_OFFSET_MIN
        value: "330"
databases:
  - name: agrixai-db
    plan: free
